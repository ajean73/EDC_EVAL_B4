services:
  mysql:
    image: mysql:8.4
    container_name: gamesup-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-gamesup}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  recommendation-api:
    build:
      context: ./CodeApiPython
      dockerfile: Dockerfile
    container_name: gamesup-recommendation-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - recommendation_artifacts:/app/artifacts

  backend:
    build:
      context: ./gamesUP
      dockerfile: Dockerfile
    container_name: gamesup-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - recommendation-api
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-gamesup}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      RECOMMENDATION_API_URL: http://recommendation-api:8001

volumes:
  mysql_data:
  recommendation_artifacts:
